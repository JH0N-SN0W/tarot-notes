<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>塔罗笔记</title>
  <meta name="description" content="塔罗笔记。流行解释供反思，不是事实，也不是对未来的承诺。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="#top">
      <span data-i18n="ui.brand">塔罗笔记</span>
      <small data-i18n="ui.brandEn">Tarot Notes</small>
    </a>
    <nav class="nav-links" aria-label="页面">
      <a href="#cards" data-i18n="ui.nav.0">五张牌</a><a href="#draw" data-i18n="ui.nav.1">抽一张</a><a href="#how" data-i18n="ui.nav.2">怎么读</a><a href="#journal" data-i18n="ui.nav.3">手记</a><a href="#boundary" data-i18n="ui.nav.4">边界</a>
    </nav>
    <button type="button" id="lang-toggle" class="lang" aria-pressed="false" data-i18n="ui.toggle">EN</button>
  </header>
  <main id="top">
    <section class="hero">
      <p class="eyebrow" data-i18n="ui.kicker">供反思，不是预言</p>
      <h1 data-i18n="ui.heroTitle">一张牌，写一页就够</h1>
      <p class="lede" data-i18n="ui.heroLede">只收五张大阿卡纳。流行解释可以读。它不是事实。它也不承诺以后。</p>
      <p class="hero-actions">
        <a class="btn solid" href="#draw" data-i18n="ui.ctaDraw">抽一张</a>
        <a class="btn ghost" href="#cards" data-i18n="ui.ctaCards">看这五张</a>
      </p>
    </section>
    <section class="draw" id="draw" aria-labelledby="draw-title">
      <div class="draw-copy">
        <p class="eyebrow" data-i18n="ui.drawEyebrow">一次一张</p>
        <h2 id="draw-title" data-i18n="ui.drawTitle">抽一张，对照今天</h2>
        <p class="section-lead" data-i18n="ui.drawLead">从这五张里抽。读到的是通行说法。用来想一想。不是算命结果。</p>
        <button type="button" id="draw-btn" class="btn solid" data-i18n="ui.drawBtn">抽一张</button>
      </div>
      <div class="draw-stage">
        <div class="draw-card" id="draw-card"><svg class="plate back-plate" viewBox="0 0 200 320" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M28 28h144v264H28z"/><path d="M40 40h120v240H40z"/><path d="M100 160m-7 0a7 7 0 1 0 0.1 0"/></g></svg></div>
        <div id="draw-result">
          <p class="fine" data-i18n="ui.drawEmpty">还没有抽。牌面是本站的线稿。</p>
        </div>
      </div>
    </section>
    <section class="cards" id="cards" aria-labelledby="cards-title">
      <p class="eyebrow" data-i18n="ui.cardsEyebrow">大阿卡纳 · 0 到 IV</p>
      <h2 id="cards-title" data-i18n="ui.cardsTitle">五张图版</h2>
      <p class="section-lead" data-i18n="ui.cardsLead">点一张，读它的注记。历史在前。流行解释在后，并标明只供反思。</p>
      <div class="grid">
        <a class="face" href="#note-fool" data-id="fool"><span class="face-num">0</span><svg class="plate" viewBox="0 0 200 320" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M46 250h92"/><path d="M132 118a11 11 0 1 1-22 0a11 11 0 1 1 22 0"/><path d="M121 129c8 6 12 14 10 24"/><path d="M121 142c-16 6-24 18-22 32"/><path d="M123 154l22 8"/><path d="M121 168l-18 36"/><path d="M121 168l24 28"/><path d="M145 196l10 4"/><path d="M62 78a16 16 0 1 1 0.1 0"/></g></svg><span class="face-name" data-i18n="card.fool.name">愚者</span><span class="face-title" data-i18n="card.fool.title">先走一小步</span></a>
      </div>
    </section>
    <section class="how" id="how">
      <h2>三步，然后放下</h2>
    </section>
    <section id="journal"><h2>写给自己的一句</h2></section>
    <section id="boundary"><h2>这页不替你下结论</h2></section>
  </main>
  <footer><p>18岁及以上。</p></footer>
  <script src="js/site.js"></script>
</body>
</html>
